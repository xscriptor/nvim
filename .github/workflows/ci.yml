name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.0
      - name: Validate config loads without errors
        run: nvim --headless -c "lua vim.cmd('q!')" -c "qa!"
      - name: Check Lua syntax
        run: |
          for f in $(find lua colors -name '*.lua' -not -path '*/lazy-lock.json'); do
            nvim --headless -c "lua local ok, err = loadfile('$f'); if not ok then io.stderr:write(err..'\n'); vim.cmd('cquit!') else vim.cmd('q!') end" 2>/dev/null || exit 1
          done
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stylua
        run: |
          curl -sL https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip -o stylua.zip
          unzip -o stylua.zip && rm stylua.zip
          chmod +x stylua && sudo mv stylua /usr/local/bin/
      - name: Check Lua formatting
        run: stylua --check lua/
